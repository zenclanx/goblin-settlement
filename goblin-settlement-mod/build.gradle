    group = 'verification'
    description = 'Checks the committed art crops and the baked meshes: groups, ground line, texture bounds, box uv.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + sourceSets.client.output
    mainClass = 'dev.local.goblinsettlement.client.ArtModelCheck'
}

tasks.register('housingAssignmentCheck', JavaExec) {
    group = 'verification'
    description = 'Checks who lives in which home, and that the rule is deterministic.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.local.goblinsettlement.housing.HousingAssignmentCheck'
}

tasks.named('check') {
    dependsOn tasks.named('settlementDemandCheck')
    dependsOn tasks.named('populationRulesCheck')
    dependsOn tasks.named('plotCoordinatesCheck')
    dependsOn tasks.named('protectedRectangleCheck')
    dependsOn tasks.named('settlementSavedDataCheck')
    dependsOn tasks.named('workerAssignmentRulesCheck')
    dependsOn tasks.named('professionRulesCheck')
    dependsOn tasks.named('trafficTargetRulesCheck')
    dependsOn tasks.named('transportSavedDataCheck')
    dependsOn tasks.named('trafficDecisionCheck')
    dependsOn tasks.named('housingRulesCheck')
    dependsOn tasks.named('blueprintCheck')
    dependsOn tasks.named('patrolRulesCheck')
    dependsOn tasks.named('shelterRulesCheck')
    dependsOn tasks.named('roadUpgradeRulesCheck')
    dependsOn tasks.named('roadLayoutCheck')
    dependsOn tasks.named('transportConnectivityCheck')
    dependsOn tasks.named('constructionMaterialCheck')
    dependsOn tasks.named('bridgeMaterialsCheck')
    dependsOn tasks.named('housingAssignmentCheck')
    dependsOn tasks.named('artModelCheck')
}

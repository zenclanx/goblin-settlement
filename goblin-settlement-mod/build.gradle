plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = 'goblin-settlement'
}

loom {
    splitEnvironmentSourceSets()

    mods {
        goblin_settlement {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

def localMinecraftLibraries = file('../../../libraries')
if (localMinecraftLibraries.isDirectory()) {
    repositories {
        maven {
            url = localMinecraftLibraries.toURI()
            metadataSources {
                mavenPom()
                artifact()
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // ArtModelCheck bakes the generated models, so the verification source set needs the mod's own
    // client output on its compile and runtime classpaths. The client-only Minecraft jar is already
    // there. The output file collection carries its builtBy, so clientClasses is ordered in for free.
    testImplementation sourceSets.client.output
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.named('test', Test) {
    failOnNoDiscoveredTests = false
}

tasks.register('populationRulesCheck', JavaExec) {
    group = 'verification'
    description = 'Runs the standalone population rule assertions.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.local.goblinsettlement.colony.PopulationRulesCheck'
}

tasks.register('plotCoordinatesCheck', JavaExec) {
    group = 'verification'
    description = 'Runs the standalone plot coordinate assertions.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.local.goblinsettlement.planning.math.PlotCoordinatesCheck'
}

